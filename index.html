      <section>
        <h1 style="font-size: 2rem; margin: 0 0 1rem;">PDF Tools Gratis untuk Gabung, Pisah, dan Kompres PDF</h1>
        <p>Tenggoo PDF adalah alat online gratis untuk mengelola dokumen PDF langsung dari browser. Gabungkan beberapa PDF, pisahkan halaman, kompres ukuran file, urutkan halaman, tambahkan nomor halaman, atau ubah PDF ke gambar.</p>
        <p><strong>Privasi Anda tetap terjaga:</strong> file diproses di perangkat Anda dan tidak diunggah ke server Tenggoo.</p>
      </section>
      <section style="margin-top: 2.5rem;">
        <h2>Fitur PDF yang tersedia</h2>
        <ul>
          <li>Gabung PDF menjadi satu file.</li>
          <li>Pisahkan halaman dari file PDF.</li>
          <li>Kompres PDF untuk mengecilkan ukuran file.</li>
          <li>Atur ulang atau putar halaman PDF.</li>
          <li>Ubah PDF ke gambar dan gambar ke PDF.</li>
          <li>Tambahkan watermark dan nomor halaman.</li>
        </ul>
      </section>
      <section style="margin-top: 2.5rem;">
        <h2>Pertanyaan Umum & Keamanan Data (FAQ)</h2>
        <h3>Apakah file PDF saya aman dan tidak akan bocor?</h3>
        <p>Sangat aman. Berbeda dengan layanan lain, Tenggoo PDF memproses 100% file secara lokal di perangkat Anda (Client-Side). File tidak pernah diunggah atau meninggalkan komputer/smartphone Anda.</p>
        <h3>Apakah file saya diunggah ke server?</h3>
        <p>Tidak. Pemrosesan file berjalan sepenuhnya secara lokal di browser Anda tanpa backend penyimpanan.</p>
        <h3>Bagaimana membuktikan bahwa aplikasi ini aman?</h3>
        <p>Anda dapat mengujinya dengan mematikan koneksi internet (mode pesawat) atau memeriksa tab Network (F12) di browser. Aplikasi tetap berjalan normal tanpa mengirim data dokumen ke server.</p>
        <h3>Apakah aman untuk dokumen kantor, instansi, atau data pribadi?</h3>
        <p>Ya. Karena tidak ada transfer data ke pihak ketiga, Tenggoo PDF sangat cocok dan patuh terhadap standar perlindungan privasi data pribadi.</p>
      </section>
